name = "bot-finanzas"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SPREADSHEET_ID = "1NG2w0XtOzvGh1qf303Dl6quRxC-zTwo0ssxyNndoKDA"
TELEGRAM_CHAT_ID = "8600382894"
TZ = "America/Bogota"

[triggers]
crons = [
  "0 11 * * *",       # 6:00 AM Colombia → resumen AM
  "0 23 * * *",       # 6:00 PM Colombia → correos (silencioso)
  "0 12 1 * *",       # 7:00 AM día 1 → reservado
  "0 23 28-31 * *",   # 6:00 PM últimos días → análisis mensual
  "*/30 * * * *"      # cada 30 min → limpieza borradores
]